<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generated App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="min-h-screen bg-gradient-to-br from-gray-900 via-purple-900 to-black text-white p-4 md:p-8 flex flex-col items-center">
  <div class="max-w-4xl w-full bg-black/30 backdrop-blur-lg rounded-3xl p-6 md:p-10 border border-purple-500/20 shadow-2xl">
    <h1 class="text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600 mb-8 text-center">
      JSON Validator & Debugger
    </h1>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="space-y-4">
        <label class="block text-sm font-medium text-gray-300">Paste your JSON</label>
        <textarea id="jsonInput" class="w-full h-64 p-4 rounded-xl bg-gray-800 text-white text-sm font-mono focus:ring-2 focus:ring-purple-500 focus:border-transparent border border-gray-700 resize-none" placeholder="{"key":"value"}"></textarea>
        <button onclick="validateJSON()" class="w-full py-3 px-6 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 rounded-xl text-white font-bold transition-all duration-300 transform hover:scale-105 shadow-lg">
          Validate JSON
        </button>
      </div>
      <div class="space-y-4">
        <label class="block text-sm font-medium text-gray-300">Validation Results</label>
        <div id="result" class="h-64 p-4 rounded-xl bg-gray-800 text-gray-300 text-sm font-mono overflow-auto border border-gray-700"></div>
        <div id="errorHighlight" class="h-64 p-4 rounded-xl bg-gray-800 text-red-400 text-sm font-mono overflow-auto border border-red-500/30"></div>
      </div>
    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
